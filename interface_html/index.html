<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C++ Sequences UI</title>
    <style>
        :root{
            --bg-color: #0b0710;
            --panel-bg: rgba(21, 14, 31, 0.85);
            --primary: #9d4edd;
            --primary-hover: #e0aaff;
            --text: #e0d4f5;
            --border: #5a189a;
            --accent: #c77dff;
        }
        body{
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b0710 0%, #1c0b2b 100%);
        }
        h1{
            color: var(--primary-hover);
            text-shadow: 0 0 15px var(--primary);
            margin: 30px 0; font-size: 2.5em; letter-spacing: 2px;
        }
        .container{
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            width: 100%; max-width: 800px;
            box-shadow: 0 0 25px rgba(157, 78, 221, 0.3);
            backdrop-filter: blur(10px);
        }
        .header-controls{
            display: flex;
            justify-content: space-between; align-items: center;
            margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px;
        }
        select{
            background: #240046;
            border: 1px solid var(--border); color: white;
            padding: 10px 15px; border-radius: 8px; font-size: 1.1em; outline: none; cursor: pointer;
            box-shadow: 0 0 10px rgba(90, 24, 154, 0.5);
        }
        button{
            background: var(--primary);
            color: white; border: none;
            padding: 10px 16px; border-radius: 6px; font-size: 0.95em;
            cursor: pointer; transition: all 0.2s ease;
            font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 0 8px rgba(157, 78, 221, 0.4);
        }
        button:hover{ background: var(--accent); box-shadow: 0 0 15px var(--primary-hover); transform: translateY(-1px); }
        button:active{ transform: translateY(1px); }
        
        .display{
            background: #000;
            padding: 25px; border-radius: 10px;
            font-family: 'Courier New', Courier, monospace; font-size: 1.6em; letter-spacing: 3px;
            color: var(--accent); border: 1px solid var(--border);
            min-height: 45px; word-wrap: break-word; text-align: center;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 15px;
        }
        .log{ font-size: 1em; color: #a491bc; margin-bottom: 25px; display:flex; justify-content: space-between; }
        
        .grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .control-group{
            border: 1px solid var(--border);
            padding: 20px; border-radius: 10px;
            background: rgba(36, 0, 70, 0.3);
        }
        .control-group h3{ margin-top: 0; color: var(--primary-hover); font-size: 1.2em; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
        .input-row{ display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        input{
            background: #10002b;
            border: 1px solid var(--border); color: white;
            padding: 8px 10px; border-radius: 6px; outline: none; width: 60px; text-align: center; font-size: 1em;
        }
        input:focus{ border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .btn-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>
    <h1>SEQUENCE</h1>
    <div class="container">
        <div class="header-controls">
            <select id="seqType">
                <option value="array">ArraySequence</option>
                <option value="list">ListSequence</option>
                <option value="bit">BitSequence</option>
            </select>
            <button onclick="send_get_request('clear')" style="background: #e5383b; box-shadow: 0 0 10px rgba(229, 56, 59, 0.4);">Clear C++ Memory</button>
        </div>
        
        <div class="display" id="display">[]</div>
        <div class="log">
            <span id="log">Status: Initialized...</span>
        </div>
        
        <div class="grid">
            <div class="control-group">
                <h3>Modify Data</h3>
                <div class="input-row">
                    Val: <input type="number" id="val" value="1">
                    Index: <input type="number" id="index" value="0">
                </div>
                <div class="btn-grid">
                    <button onclick="send_post_request('append')">Append</button>
                    <button onclick="send_post_request('prepend')">Prepend</button>
                    <button onclick="send_post_request('insert')">Insert At</button>
                </div>
                
                <h3 style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border);">Concat</h3>
                <div class="input-row">
                    Array (CSV): <input type="text" id="csv" value="10,20" style="width: 120px; text-align: left;">
                </div>
                <button onclick="send_post_request('concat')" style="width: 100%;">Concat</button>
            </div>
            
            <div class="control-group">
                <h3>Retrieve Elements</h3>
                <div class="input-row">
                    Start: <input type="number" id="start" value="0">
                    End: <input type="number" id="end" value="1">
                </div>
                <div class="btn-grid">
                    <button onclick="send_post_request('get_first')">Get First</button>
                    <button onclick="send_post_request('get_last')">Get Last</button>
                    <button onclick="send_post_request('get')">Get by index</button>
                    <button onclick="send_post_request('subseq')">Subsequence</button>
                </div>

                <div id="funcOps">
                    <h3 style="margin-top: 15px; padding-top: 10px; border-top: 1px solid var(--border);">Functional (Map/Where)</h3>
                    <div class="btn-grid">
                        <button onclick="send_post_request('map')">Map (*2)</button>
                        <button onclick="send_post_request('where')">Where (>60)</button>
                        <button onclick="send_post_request('reduce')">Reduce (Sum)</button>
                    </div>
                </div>
            </div>

            <div class="control-group" id="bitOps" style="display:none; grid-column: span 2;">
                <h3>Binary Operations</h3>
                <div class="input-row">
                    Mask (binary string): <input type="text" id="mask" value="101" style="width: 200px; text-align: left; padding-left: 15px;">
                </div>
                <div class="btn-grid" style="grid-template-columns: repeat(4, 1fr);">
                    <button onclick="send_post_request('bit_not')">NOT (~)</button>
                    <button onclick="send_post_request('bit_and')">AND (&)</button>
                    <button onclick="send_post_request('bit_or')">OR (|)</button>
                    <button onclick="send_post_request('bit_xor')">XOR (^)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let type_selector = document.getElementById('seqType');
        let bit_operations_panel = document.getElementById('bitOps');


        function updateUI(){
            if (type_selector.value === 'bit'){
                bit_operations_panel.style.display = 'block';
            } else{
                bit_operations_panel.style.display = 'none';
            }
        }


        type_selector.addEventListener('change', function(){
            updateUI();
            send_get_request('get_state');
        });


        async function send_get_request(endpoint_name){
            let data_to_send = {};
            data_to_send.type = type_selector.value;
            
            let url_parameters = new URLSearchParams(data_to_send);
            
            try{
                let response = await fetch('/api/' + endpoint_name + '?' + url_parameters.toString());
                let json_response = await response.json();
                

                let display_string = "[]";
                if (Array.isArray(json_response.state)){
                    if (json_response.state.length > 0){
                        display_string = "[ " + json_response.state.join(", ") + " ]";
                    }
                }
                
                document.getElementById('display').innerText = display_string;
                document.getElementById('log').innerText = "Status: " + json_response.log;
            } 
            catch(error){
                document.getElementById('log').innerText = "Status: Error calling server";
            }
        }
        
        async function send_post_request(action_name){
            

            let csv_text = document.getElementById('csv').value;
            let string_array = csv_text.split(',');
            let numbers_array = [];
            
            for (let i = 0; i < string_array.length; i++){
                let trimmed_string = string_array[i].trim();
                if (trimmed_string !== ""){
                    numbers_array.push(Number(trimmed_string));
                }
            }
            let mask_element = document.getElementById('mask');
            let mask_value = "";
            if (mask_element !== null){
                mask_value = mask_element.value;
            }


            let data_to_send ={
                type: type_selector.value,
                val: parseInt(document.getElementById('val').value) || 0,
                index: parseInt(document.getElementById('index').value) || 0,
                start: parseInt(document.getElementById('start').value) || 0,
                end: parseInt(document.getElementById('end').value) || 0,
                mask: mask_value,
                items: numbers_array
            };
            
            try{
                let response = await fetch('/api/' + action_name,{
                    method: 'POST',
                    headers:{
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data_to_send)
                });
                
                let json_response = await response.json();
                
                let display_string = "[]";
                if (Array.isArray(json_response.state)){
                    if (json_response.state.length > 0){
                        display_string = "[ " + json_response.state.join(", ") + " ]";
                    }
                }
                
                document.getElementById('display').innerText = display_string;
                document.getElementById('log').innerText = "Status: " + json_response.log;
            } 
            catch(error){
                document.getElementById('log').innerText = "Status: Error calling server";
            }
        }
    
        updateUI();
        send_get_request('get_state');
    </script>
</body>
</html>
